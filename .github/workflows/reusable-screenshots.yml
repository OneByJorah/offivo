name: Screenshots (reusable)

# Starts the project with docker compose (demo data only), runs a Playwright script,
# and opens a PR with the new images. Only call this on trusted events
# (workflow_dispatch, push to the default branch), never on pull requests from forks,
# especially when using a self-hosted runner.
#
# Repo setting required: Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests".

on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: ubuntu-latest
      compose-file:
        type: string
        default: docker-compose.yml
      base-url:
        type: string
        default: http://127.0.0.1:8080
      health-url:
        type: string
        default: http://127.0.0.1:8080/healthz
      script:
        type: string
        default: scripts/screenshots.mjs
      output-dir:
        type: string
        default: docs/screenshots
      install-deps:
        description: Run "playwright install --with-deps" (needs sudo). Set false on a prepared self-hosted runner.
        type: boolean
        default: true
      branch:
        type: string
        default: bot/screenshots

permissions:
  contents: write
  pull-requests: write

jobs:
  screenshots:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    env:
      DEMO_MODE: "true"
      BASE_URL: ${{ inputs.base-url }}
      OUT_DIR: ${{ inputs.output-dir }}
      COMPOSE_FILE_PATH: ${{ inputs.compose-file }}
      HEALTH_URL: ${{ inputs.health-url }}
      SCREENSHOT_SCRIPT: ${{ inputs.script }}
      BRANCH: ${{ inputs.branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"

      - name: Start the stack (demo mode)
        run: |
          COMPOSE_DIR="$(dirname "$COMPOSE_FILE_PATH")"
          if [ ! -f "$COMPOSE_DIR/.env" ]; then
            if [ -f "$COMPOSE_DIR/.env.example" ]; then cp "$COMPOSE_DIR/.env.example" "$COMPOSE_DIR/.env";
            else : > "$COMPOSE_DIR/.env"; fi
          fi
          docker compose -f "$COMPOSE_FILE_PATH" up -d --build

      - name: Wait for health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS "$HEALTH_URL" >/dev/null 2>&1; then echo "healthy after ${i}s"; exit 0; fi
            sleep 1
          done
          docker compose -f "$COMPOSE_FILE_PATH" logs --tail=100
          echo "Service did not become healthy"; exit 1

      - name: Install Playwright
        env:
          INSTALL_DEPS: ${{ inputs.install-deps }}
        run: |
          npm install --no-save playwright
          if [ "$INSTALL_DEPS" = "true" ]; then npx playwright install --with-deps chromium; else npx playwright install chromium; fi

      - name: Capture screenshots
        run: node "$SCREENSHOT_SCRIPT"

      - name: Stop the stack
        if: always()
        run: docker compose -f "$COMPOSE_FILE_PATH" down -v

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: screenshots
          path: ${{ inputs.output-dir }}

      - name: Open a PR with the new images
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add "$OUT_DIR"
          if git diff --cached --quiet; then echo "No screenshot changes"; exit 0; fi
          git commit -m "docs: update screenshots"
          git push --force origin "$BRANCH"  # bot branch is regenerated wholesale each run
          if gh pr view "$BRANCH" --state OPEN >/dev/null 2>&1; then
            echo "PR already open for $BRANCH"
          else
            gh pr create --base "$DEFAULT_BRANCH" --head "$BRANCH" \
              --title "docs: update screenshots" \
              --body "Automated screenshots captured from the demo stack. Review each image for real data before merging." \
              || echo "PR create skipped (already exists from a concurrent run) - success outcome"
          fi
